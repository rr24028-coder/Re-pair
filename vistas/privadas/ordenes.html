<!DOCTYPE html>
<html lang="es-SV">
<head>

    <meta property="og:image" content="https://rr24028-coder.github.io/Re-pair/imagenes/iconos/logo-re-pear-fresh.png">

    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "WebPage",
        "name": "Órdenes de servicio · Re-pear",
        "description": "Seguimiento de órdenes y facturación de mantenimiento de computadores.",
        "url": "https://rr24028-coder.github.io/Re-pair/vistas/privadas/ordenes.html"
    }
    </script>

    <link rel="icon" href="../../imagenes/iconos/favicon-fresh.svg" type="image/svg+xml">
    <link rel="alternate icon" href="../../imagenes/iconos/favicon.ico" sizes="32x32">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../estilos/ordenes.css">
</head>
<body data-page="orders">
    <svg xmlns="http://www.w3.org/2000/svg" style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true">
        <defs id="icon-defs">
            <symbol id="pear-fruit" viewBox="0 0 64 64">
                <path d="M32 17C22 17 22 29 17 36C6 52 17 61 32 61S58 52 47 36C42 29 42 17 32 17Z" fill="#A5D95C"/>
                <path d="M32 18V10H43V5" fill="none" stroke="#1B4332" stroke-width="3.5" stroke-linecap="round"/>
                <circle cx="43" cy="5" r="3" fill="#FF8A5B"/>
                <path d="M31 14C23 14 21 10 22 5C28 5 32 8 31 14Z" fill="#2D6A4F"/>
            </symbol>
            <symbol id="plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></symbol>
            <symbol id="receipt" viewBox="0 0 24 24"><path d="M4 3l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1v19l-2-1-2 1-2-1-2 1-2-1-2 1-2-1-2 1V3Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M8 7h8m-8 5h8m-8 5h4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></symbol>
        </defs>
    </svg>

    <div class="shell">
        <header class="topbar">
            <a href="panel.html" class="brand" aria-label="Re-pear, Inicio">
                <svg aria-hidden="true"><use href="#pear-fruit"/></svg>
                <span>Re<em>-</em>pear</span>
            </a>
            <nav class="mainnav" id="sidebar" aria-label="Navegación principal">
                <a class="nav-link" id="nav-inicio" href="panel.html">Inicio</a>
                <a class="nav-link" id="nav-equipos" href="equipos.html">Mis equipos</a>
                <a class="nav-link active" id="nav-ordenes" href="ordenes.html" aria-current="page">Órdenes</a>
                <a class="nav-link" id="nav-catalogo" href="catalogo.html">Catálogo</a>
                <a class="nav-link" id="nav-finanzas" href="finanzas.html">Finanzas</a>
            </nav>
            <div style="margin-left: auto; display: flex; gap: 15px; align-items: center;">
    <a href="../publicas/ingresar.html" id="login-btn" class="btn outline small" style="display: none;">Ingresar</a>
    <button id="logout-btn" class="btn small" style="background-color: var(--peach-ink); color: white; display: none;">Cerrar sesión</button>
</div>
        </header>

        <main class="main">
            <nav class="crumbs" id="breadcrumbs" aria-label="Ruta de navegación">
                <a href="panel.html">Inicio</a>
                <span aria-hidden="true">/</span>
                <span>Panel especialista</span>
                <span aria-hidden="true">/</span>
                <span aria-current="page">Órdenes de servicio</span>
            </nav>

            <section class="screen" id="orders">
                <div class="page-head">
                    <div>
                        <div class="eyebrow">Panel especialista</div>
                        <h1>Órdenes de servicio</h1>
                        <p>Reporte técnico y factura de cada orden.</p>
                    </div>
                    <button class="btn primary" data-action="new-order">
                        <svg class="icon" aria-hidden="true"><use href="#plus"/></svg>Nueva orden
                    </button>
                </div>

                <div class="panel table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>Orden</th>
                                <th>Cliente</th>
                                <th>Equipo</th>
                                <th>Servicio principal</th>
                                <th>Estado</th>
                                <th>Acción</th>
                            </tr>
                        </thead>
                        <tbody id="orders-body">
                            <tr><td colspan="6" style="text-align:center;padding:30px;color:var(--muted);">Cargando órdenes…</td></tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </main>

        <dialog id="order-dialog" style="border:1px solid var(--border);border-radius:28px;background:var(--surface);color:var(--ink);padding:0;width:min(480px, calc(100% - 28px));box-shadow:0 30px 90px #06241655;">
            <div style="padding:24px 28px;border-bottom:1px solid var(--border);">
                <h2 style="font-size:22px;margin:0;">Nueva orden de servicio</h2>
            </div>
            <form id="order-form" novalidate style="padding:28px;">
                <div style="display:grid;gap:17px;">
                    <div>
                        <label for="order-email" style="display:block;font-size:13px;font-weight:600;margin-bottom:7px;">Correo del cliente</label>
                        <input id="order-email" type="email" maxlength="80" autocomplete="off" placeholder="Ej.: usuario@ues.edu.sv" aria-describedby="order-email-error" style="width:100%;padding:12px;border:1px solid var(--border);border-radius:14px;">
                        <p class="field-error" id="order-email-error" aria-live="polite" hidden style="margin-top:6px;font-size:12.5px;color:var(--peach-ink);"></p>
                    </div>
                    <div>
                        <label for="order-equipo" style="display:block;font-size:13px;font-weight:600;margin-bottom:7px;">Equipo (marca y modelo)</label>
                        <input id="order-equipo" maxlength="60" autocomplete="off" placeholder="Ej.: Lenovo ThinkPad T14" aria-describedby="order-equipo-error" style="width:100%;padding:12px;border:1px solid var(--border);border-radius:14px;">
                        <p class="field-error" id="order-equipo-error" aria-live="polite" hidden style="margin-top:6px;font-size:12.5px;color:var(--peach-ink);"></p>
                    </div>
                </div>
                <div style="display:flex;justify-content:flex-end;gap:10px;margin-top:24px;">
                    <button type="button" class="btn outline" data-close="order-dialog" style="background-color:#ddd;color:#333;">Cancelar</button>
                    <button class="btn primary" id="order-save">Crear orden</button>
                </div>
            </form>
        </dialog>
    </div>
    <script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
  import { getFirestore, collection, addDoc, getDocs, doc, updateDoc, query, where, setDoc, getDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
  import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyB8q0dzo5W3DYb1920keTFNwjNtoPr_PL4",
    authDomain: "re-pear-web.firebaseapp.com",
    projectId: "re-pear-web",
    storageBucket: "re-pear-web.firebasestorage.app",
    messagingSenderId: "932851115801",
    appId: "1:932851115801:web:491a62ddd96dae78e18788"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const auth = getAuth(app);

  window.db = db;
  window.collection = collection;
  window.addDoc = addDoc;
  window.getDocs = getDocs;
  window.doc = doc;
  window.updateDoc = updateDoc;
  window.query = query;
  window.where = where;
  window.setDoc = setDoc;
  window.getDoc = getDoc;
  window.onSnapshot = onSnapshot;
  
  window.auth = auth;
  window.createUserWithEmailAndPassword = createUserWithEmailAndPassword;
  window.signInWithEmailAndPassword = signInWithEmailAndPassword;
  window.onAuthStateChanged = onAuthStateChanged;
  window.signOut = signOut;
</script>
<script type="module" src="../../scripts/app.js"></script>
</body>
</html>
